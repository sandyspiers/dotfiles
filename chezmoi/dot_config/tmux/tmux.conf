# ============================================================
# General
# ============================================================

run-shell "tmux set -g default-shell $(which nu)"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position bottom

# True color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Allow passthrough for yazi preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ============================================================
# Prefix (rare ops only; sent from the Sofle as one-shot Alt, then ;)
# ============================================================

unbind C-b
set -g prefix M-\;
bind M-\; send-prefix

# ============================================================
# No-prefix bindings (one-shot Alt + key)
# Right hand is spatial; left hand uses vim C-w / mnemonic letters.
# ============================================================

# Focus pane (nvim splits use C-h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize pane: the keys directly below hjkl
bind -n M-n resize-pane -L 3
bind -n M-m resize-pane -D 3
bind -n M-, resize-pane -U 3
bind -n M-. resize-pane -R 3

# Move pane: swap with its neighbour, focus follows (vim C-w H/J/K/L)
bind -n M-H swap-pane -d -t '{left-of}'
bind -n M-J swap-pane -d -t '{down-of}'
bind -n M-K swap-pane -d -t '{up-of}'
bind -n M-L swap-pane -d -t '{right-of}'

# Split (vim C-w s / C-w v), kill, zoom, break out, cycle layout
bind -n M-s split-window -v -c "#{pane_current_path}"
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-x kill-pane
bind -n M-z resize-pane -Z
bind -n M-p break-pane
bind -n M-y next-layout

# Windows
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-i previous-window
bind -n M-o next-window
bind -n M-I swap-window -t -1\; select-window -t -1
bind -n M-O swap-window -t +1\; select-window -t +1
bind -n M-a last-window
bind -n M-r command-prompt -I "#W" "rename-window '%%'"
bind -n M-q confirm-before -p "Kill window #W? (y/n)" kill-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Sessions, copy mode (search from copy mode with ? or /)
bind -n M-w choose-tree -Zs
bind -n M-d detach-client
bind -n M-/ copy-mode

# ============================================================
# Floating runners (M-f, then key). The Sofle's F layer sends
# these as one key: F*, g sends M-f g.
# ============================================================

bind -n M-f switch-client -T float
bind -T float g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind -T float b display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "btop"
bind -T float y display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "yazi"
bind -T float t display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "fzf-tail"
bind -T float s display-popup -E -d "#{pane_current_path}" -w 80% -h 80%
bind -T float k display-popup -E -w 90% -h 90% "glow -t -w 0 ~/.config/keybinds"
bind -T float p display-popup -E -w 60% -h 60% "tmux-project --pick"

# ============================================================
# Prefix bindings (M-; then key)
# ============================================================

bind h join-pane -t :-1
bind l join-pane -t :+1
bind a switch-client -l
bind x confirm-before -p "Kill session #S? (y/n)" kill-session
bind n command-prompt -p "New session:" "new-session -s '%%'"
bind '$' command-prompt -I "#S" "rename-session '%%'"
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"
bind q confirm-before -p "Kill server? (y/n)" kill-server

# ============================================================
# Copy mode (vi keys)
# ============================================================

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ============================================================
# TPM + Dracula
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'

set -g @dracula-show-left-icon "#S"
set -g @dracula-show-ssh-only-when-connected true
set -g @dracula-show-ssh-session-port false
set -g @dracula-time-format "%I:%M%p"
set -g @dracula-plugins "git time ssh-session"

run '~/.tmux/plugins/tpm/tpm'
